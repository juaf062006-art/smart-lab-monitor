<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Lab AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; }

    #ui {
      position:fixed; top:0; left:0; right:0; z-index:999;
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
      pointer-events:none; font-family:sans-serif;
    }
    .ui-title { font-size:12px; font-weight:700; color:#fff; letter-spacing:.1em; text-transform:uppercase; }
    .ui-sub   { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
    #pill {
      display:flex; align-items:center; gap:6px;
      background:rgba(0,212,170,0.18); border:1px solid rgba(0,212,170,0.4);
      border-radius:20px; padding:4px 12px; font-size:10px; color:#00d4aa;
    }
    .pdot { width:6px; height:6px; border-radius:50%; background:#00d4aa; animation:blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  </style>
</head>
<body>

<div id="ui">
  <div>
    <div class="ui-title">Smart Lab AR</div>
    <div class="ui-sub">Apunta al marcador Hiro</div>
  </div>
  <div id="pill"><div class="pdot"></div><span id="pill-text">Conectando...</span></div>
</div>

<a-scene
  embedded
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;"
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  style="width:100vw;height:100vh;">

  <a-assets>
    <canvas id="panel-canvas" width="1024" height="512"></canvas>
  </a-assets>

  <a-marker preset="hiro" id="marker">

    <!-- Panel como textura canvas -->
    <a-plane
      id="panel-plane"
      position="0 0.01 0"
      rotation="-90 0 0"
      width="2.2" height="1.1"
      material="src:#panel-canvas; transparent:true;">
    </a-plane>

    <!-- Esfera flotante animada -->
    <a-sphere
      id="ar-sphere"
      position="0 0.9 0"
      radius="0.13"
      color="#00d4aa"
      animation="property:position; from:0 0.75 0; to:0 1.05 0; dir:alternate; dur:1000; loop:true; easing:easeInOutSine"
      animation__scale="property:scale; from:1 1 1; to:1.1 1.1 1.1; dir:alternate; dur:800; loop:true; easing:easeInOutSine">
    </a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // ── Firebase ──────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyDWN9YbdTau_mUEQs50A2fmxtMeGIe4qWo",
    authDomain: "smart-lab-monitor-d758a.firebaseapp.com",
    databaseURL: "https://smart-lab-monitor-d758a-default-rtdb.firebaseio.com",
    projectId: "smart-lab-monitor-d758a",
    storageBucket: "smart-lab-monitor-d758a.firebasestorage.app",
    messagingSenderId: "89073383808",
    appId: "1:89073383808:web:26ea913952d586af752965"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ── Canvas panel ──────────────────────────────────
  const canvas  = document.getElementById('panel-canvas');
  const ctx     = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function colorEstado(e) { return {ok:'#00d4aa', warn:'#f59e0b', danger:'#ef4444'}[e]; }
  function labelEstado(e) { return {ok:'Normal', warn:'PRECAUCION', danger:'PELIGRO'}[e]; }
  function eTemp(v) { return v>35?'danger':v>30?'warn':'ok'; }
  function eHum(v)  { return v>80?'warn':'ok'; }
  function eAire(v) { return v>800?'danger':v>500?'warn':'ok'; }

  function drawPanel(temp, hum, aire, hora) {
    const eT = eTemp(temp), eH = eHum(hum), eA = eAire(aire);
    const eg = [eT,eH,eA].includes('danger')?'danger':[eT,eH,eA].includes('warn')?'warn':'ok';

    // Fondo
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = 'rgba(5,13,26,0.93)';
    roundRect(ctx, 0, 0, W, H, 32);
    ctx.fill();

    // Barra superior
    ctx.fillStyle = colorEstado(eg);
    roundRect(ctx, 0, 0, W, 14, {tl:32, tr:32, bl:0, br:0});
    ctx.fill();

    // Título
    ctx.fillStyle = '#00d4aa';
    ctx.font = 'bold 38px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SMART LAB MONITOR', W/2, 72);

    // Línea divisora
    ctx.strokeStyle = '#0e2a4a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(40, 100); ctx.lineTo(W-40, 100); ctx.stroke();

    // Columnas
    const cols = [
      { x: W*0.17, label:'TEMPERATURA', val: temp.toFixed(1)+' °C', estado: eT },
      { x: W*0.5,  label:'HUMEDAD',     val: hum.toFixed(0)+' %',   estado: eH },
      { x: W*0.83, label:'AIRE',        val: aire.toFixed(0)+' ppm',  estado: eA },
    ];

    cols.forEach(col => {
      // Label
      ctx.fillStyle = '#64748b';
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(col.label, col.x, 155);

      // Valor
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 72px monospace';
      ctx.fillText(col.val, col.x, 270);

      // Estado
      ctx.fillStyle = colorEstado(col.estado);
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(labelEstado(col.estado), col.x, 340);
    });

    // Divisores verticales
    ctx.strokeStyle = '#0e2a4a';
    ctx.lineWidth = 2;
    [W*0.335, W*0.665].forEach(x => {
      ctx.beginPath(); ctx.moveTo(x, 115); ctx.lineTo(x, 360); ctx.stroke();
    });

    // Línea inferior
    ctx.beginPath(); ctx.moveTo(40, 370); ctx.lineTo(W-40, 370); ctx.stroke();

    // Footer
    ctx.fillStyle = '#334155';
    ctx.font = '24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Actualizado: ' + hora + '  |  Digitales III · ESP32 + IoT + AR', W/2, 420);

    // Barra inferior
    ctx.fillStyle = colorEstado(eg);
    ctx.globalAlpha = 0.35;
    roundRect(ctx, 0, H-14, W, 14, {tl:0, tr:0, bl:32, br:32});
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // Actualizar textura A-Frame
    const plane = document.getElementById('panel-plane');
    if (plane) {
      plane.getObject3D('mesh').material.map.needsUpdate = true;
    }

    // Esfera color
    const sphere = document.getElementById('ar-sphere');
    if (sphere) sphere.setAttribute('color', colorEstado(eg));
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (typeof r === 'number') r = {tl:r, tr:r, br:r, bl:r};
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r.tr);
    ctx.lineTo(x+w, y+h-r.br);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r.br, y+h);
    ctx.lineTo(x+r.bl, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r.bl);
    ctx.lineTo(x, y+r.tl);
    ctx.quadraticCurveTo(x, y, x+r.tl, y);
    ctx.closePath();
  }

  // Dibujar placeholder
  drawPanel(0, 0, 0, '--:--:--');

  // Firebase listener
  db.ref('/laboratorio').on('value', snap => {
    const d = snap.val();
    if (!d) return;
    const temp = parseFloat(d.temperatura)||0;
    const hum  = parseFloat(d.humedad)||0;
    const aire = parseFloat(d.calidad_aire)||0;
    const hora = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    drawPanel(temp, hum, aire, hora);
    document.getElementById('pill-text').textContent = 'En linea';
  });
</script>
</body>
</html>
