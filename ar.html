<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Lab AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; }
    #ui {
      position:fixed; top:0; left:0; right:0; z-index:999;
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
      pointer-events:none; font-family:sans-serif;
    }
    .ui-title { font-size:12px; font-weight:700; color:#fff; letter-spacing:.1em; text-transform:uppercase; }
    .ui-sub   { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
    #pill {
      display:flex; align-items:center; gap:6px;
      background:rgba(0,212,170,0.18); border:1px solid rgba(0,212,170,0.4);
      border-radius:20px; padding:4px 12px; font-size:10px; color:#00d4aa;
    }
    .pdot { width:6px; height:6px; border-radius:50%; background:#00d4aa; animation:blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  </style>
  <style>
    @keyframes flashRed {
      0%,100% { background: transparent; }
      50% { background: rgba(239,68,68,0.25); }
    }
    .flash-danger { animation: flashRed 0.6s infinite; }
  </style>
</head>
<body>

<div id="flash-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:998;pointer-events:none;transition:all .3s;"></div>
<div id="ui">
  <div>
    <div class="ui-title">Smart Lab AR</div>
    <div class="ui-sub">Apunta al marcador Hiro</div>
  </div>
  <div id="pill"><div class="pdot"></div><span id="pill-text">Conectando...</span></div>
</div>

<a-scene
  embedded
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;"
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  style="width:100vw;height:100vh;">

  <a-assets>
    <canvas id="panel-canvas" width="1024" height="460"></canvas>
  </a-assets>

  <a-marker preset="hiro">

    <a-plane
      id="panel-plane"
      position="0 0.01 0"
      rotation="-90 0 0"
      width="2.2" height="1.0"
      material="src:#panel-canvas; transparent:true;">
    </a-plane>

    <!-- Esfera arriba y centrada, no tapa columnas -->
    <a-sphere
      id="ar-sphere"
      position="0 1.1 0"
      radius="0.13"
      color="#00d4aa"
      animation="property:position; from:0 0.95 0; to:0 1.25 0; dir:alternate; dur:1000; loop:true; easing:easeInOutSine"
      animation__scale="property:scale; from:1 1 1; to:1.12 1.12 1.12; dir:alternate; dur:800; loop:true; easing:easeInOutSine">
    </a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const DB_URL = "https://smart-lab-monitor-d758a-default-rtdb.firebaseio.com/laboratorio.json";
  const canvas = document.getElementById('panel-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function colorEstado(e) { return {ok:'#00d4aa', warn:'#f59e0b', danger:'#ef4444'}[e]; }
  function labelEstado(e) { return {ok:'Normal', warn:'PRECAUCION', danger:'PELIGRO'}[e]; }
  function eTemp(v) { return v>35?'danger':v>30?'warn':'ok'; }
  function eHum(v)  { return v>80?'warn':'ok'; }
  function eAire(v) { return v>800?'danger':v>500?'warn':'ok'; }

  function roundRect(ctx,x,y,w,h,r) {
    if (typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    ctx.beginPath();
    ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    ctx.lineTo(x+r.bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y);
    ctx.closePath();
  }

  function drawPanel(temp, hum, aire) {
    const eT=eTemp(temp), eH=eHum(hum), eA=eAire(aire);
    const eg=[eT,eH,eA].includes('danger')?'danger':[eT,eH,eA].includes('warn')?'warn':'ok';

    ctx.clearRect(0,0,W,H);

    // Fondo
    ctx.fillStyle='rgba(5,13,26,0.95)';
    roundRect(ctx,0,0,W,H,32); ctx.fill();

    // Barra superior color estado
    ctx.fillStyle=colorEstado(eg);
    roundRect(ctx,0,0,W,16,{tl:32,tr:32,bl:0,br:0}); ctx.fill();

    // Título
    ctx.fillStyle='#00d4aa';
    ctx.font='bold 40px monospace';
    ctx.textAlign='center';
    ctx.fillText('SMART LAB MONITOR', W/2, 78);

    // Divisor sup
    ctx.strokeStyle='#0e2a4a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(40,105); ctx.lineTo(W-40,105); ctx.stroke();

    // Columnas
    const cols = [
      {x:W*0.17, label:'TEMPERATURA', val:temp.toFixed(1)+' °C', e:eT},
      {x:W*0.5,  label:'HUMEDAD',     val:hum.toFixed(0)+' %',   e:eH},
      {x:W*0.83, label:'AIRE',        val:aire.toFixed(0)+' ppm', e:eA},
    ];

    cols.forEach(col => {
      // Label
      ctx.fillStyle='#64748b'; ctx.font='28px sans-serif'; ctx.textAlign='center';
      ctx.fillText(col.label, col.x, 158);
      // Valor grande
      ctx.fillStyle='#ffffff'; ctx.font='bold 78px monospace';
      ctx.fillText(col.val, col.x, 278);
      // Estado
      ctx.fillStyle=colorEstado(col.e); ctx.font='bold 32px sans-serif';
      ctx.fillText(labelEstado(col.e), col.x, 356);
    });

    // Divisores verticales
    ctx.strokeStyle='#0e2a4a'; ctx.lineWidth=2;
    [W*0.335, W*0.665].forEach(x => {
      ctx.beginPath(); ctx.moveTo(x,115); ctx.lineTo(x,375); ctx.stroke();
    });

    // Barra inferior color estado
    ctx.fillStyle=colorEstado(eg); ctx.globalAlpha=0.4;
    roundRect(ctx,0,H-16,W,16,{tl:0,tr:0,bl:32,br:32}); ctx.fill();
    ctx.globalAlpha=1.0;

    // Actualizar textura
    const plane=document.getElementById('panel-plane');
    if(plane&&plane.getObject3D('mesh'))
      plane.getObject3D('mesh').material.map.needsUpdate=true;

    // Esfera
    const sphere=document.getElementById('ar-sphere');
    if(sphere) sphere.setAttribute('color', colorEstado(eg));
  }

  drawPanel(0,0,0);

  async function fetchData() {
    try {
      const res = await fetch(DB_URL);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const d = await res.json();
      if(!d) return;
      drawPanel(
        parseFloat(d.te
