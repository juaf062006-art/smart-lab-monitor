<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Lab AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:sans-serif; }
    #ui {
      position:fixed; top:0; left:0; right:0; z-index:999;
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
      pointer-events:none;
    }
    .ui-title { font-size:12px; font-weight:700; color:#fff; letter-spacing:.1em; text-transform:uppercase; }
    .ui-sub   { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
    #pill {
      display:flex; align-items:center; gap:6px;
      background:rgba(0,212,170,0.18); border:1px solid rgba(0,212,170,0.4);
      border-radius:20px; padding:4px 12px;
      font-size:10px; color:#00d4aa;
    }
    .pdot { width:6px; height:6px; border-radius:50%; background:#00d4aa; animation:blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    #hint {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      z-index:999; pointer-events:none;
      background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.15);
      border-radius:20px; padding:7px 18px;
      font-size:11px; color:rgba(255,255,255,0.6); white-space:nowrap;
    }
  </style>
</head>
<body>

<div id="ui">
  <div>
    <div class="ui-title">Smart Lab AR</div>
    <div class="ui-sub">Apunta al marcador Hiro</div>
  </div>
  <div id="pill"><div class="pdot"></div><span id="pill-text">Conectando...</span></div>
</div>
<div id="hint">Mantén el marcador Hiro dentro del encuadre</div>

<a-scene
  embedded
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;"
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  style="width:100vw;height:100vh;">

  <a-marker preset="hiro">

    <!-- Esfera flotante animada — indicador de estado -->
    <a-sphere
      id="ar-sphere"
      position="0 1.2 0"
      radius="0.15"
      color="#00d4aa"
      animation="property:position; from:0 1.0 0; to:0 1.4 0; dir:alternate; dur:1000; loop:true; easing:easeInOutSine"
      animation__pulse="property:scale; from:1 1 1; to:1.15 1.15 1.15; dir:alternate; dur:800; loop:true; easing:easeInOutSine">
    </a-sphere>

    <!-- Panel principal — billboard (siempre mira a la cámara) -->
    <a-entity position="0 0.5 0" look-at="[camera]">

      <!-- Fondo del panel -->
      <a-plane
        width="2.0" height="1.5"
        color="#050d1a"
        opacity="0.88"
        position="0 0 -0.001">
      </a-plane>

      <!-- Barra superior teal -->
      <a-plane
        width="2.0" height="0.07"
        color="#00d4aa"
        position="0 0.715 0">
      </a-plane>

      <!-- Título -->
      <a-text
        id="ar-title"
        value="SMART LAB MONITOR"
        position="0 0.58 0"
        align="center"
        color="#00d4aa"
        width="3.5"
        font="https://cdn.aframe.io/fonts/mozillavr.fnt">
      </a-text>

      <!-- Línea divisora superior -->
      <a-plane width="1.8" height="0.012" color="#0e2a4a" position="0 0.43 0"></a-plane>

      <!-- ── TEMPERATURA ── -->
      <a-text value="TEMPERATURA" position="-0.62 0.34 0" align="center" color="#64748b" width="2.0"></a-text>
      <a-text id="ar-temp" value="--°C" position="-0.62 0.18 0" align="center" color="#ffffff" width="3.2"></a-text>
      <a-text id="ar-temp-st" value="normal" position="-0.62 0.04 0" align="center" color="#00d4aa" width="2.2"></a-text>

      <!-- Divisor vertical izq -->
      <a-plane width="0.012" height="0.55" color="#0e2a4a" position="-0.12 0.18 0"></a-plane>

      <!-- ── HUMEDAD ── -->
      <a-text value="HUMEDAD" position="0.38 0.34 0" align="center" color="#64748b" width="2.0"></a-text>
      <a-text id="ar-hum" value="--%"  position="0.38 0.18 0" align="center" color="#ffffff" width="3.2"></a-text>
      <a-text id="ar-hum-st" value="normal" position="0.38 0.04 0" align="center" color="#00d4aa" width="2.2"></a-text>

      <!-- Divisor vertical der -->
      <a-plane width="0.012" height="0.55" color="#0e2a4a" position="0.88 0.18 0"></a-plane>

      <!-- ── AIRE ── -->
      <a-text value="CALIDAD AIRE" position="1.12 0.34 0" align="center" color="#64748b" width="1.8"></a-text>
      <a-text id="ar-aire" value="-- ppm" position="1.12 0.18 0" align="center" color="#ffffff" width="2.6"></a-text>
      <a-text id="ar-aire-st" value="normal" position="1.12 0.04 0" align="center" color="#00d4aa" width="2.2"></a-text>

      <!-- Línea divisora inferior -->
      <a-plane width="1.8" height="0.012" color="#0e2a4a" position="0 -0.12 0"></a-plane>

      <!-- Footer -->
      <a-text id="ar-hora" value="Esperando datos..." position="0 -0.27 0" align="center" color="#334155" width="2.8"></a-text>

      <!-- Barra inferior teal -->
      <a-plane width="2.0" height="0.05" color="#00d4aa" opacity="0.4" position="0 -0.725 0"></a-plane>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // Registrar componente look-at
  AFRAME.registerComponent('look-at', {
    schema: {type: 'selector'},
    tick: function () {
      const target = this.data || document.querySelector('[camera]');
      if (!target) return;
      this.el.object3D.lookAt(target.object3D ? target.object3D.position : new THREE.Vector3());
    }
  });

  // Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDWN9YbdTau_mUEQs50A2fmxtMeGIe4qWo",
    authDomain: "smart-lab-monitor-d758a.firebaseapp.com",
    databaseURL: "https://smart-lab-monitor-d758a-default-rtdb.firebaseio.com",
    projectId: "smart-lab-monitor-d758a",
    storageBucket: "smart-lab-monitor-d758a.firebasestorage.app",
    messagingSenderId: "89073383808",
    appId: "1:89073383808:web:26ea913952d586af752965"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function colorEstado(e) { return {ok:'#00d4aa', warn:'#f59e0b', danger:'#ef4444'}[e]; }
  function labelEstado(e) { return {ok:'Normal', warn:'PRECAUCION', danger:'PELIGRO'}[e]; }
  function eTemp(v) { return v>35?'danger':v>30?'warn':'ok'; }
  function eHum(v)  { return v>80?'warn':'ok'; }
  function eAire(v) { return v>800?'danger':v>500?'warn':'ok'; }

  function set(id, attr, val) {
    const el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  }

  db.ref('/laboratorio').on('value', snap => {
    const d = snap.val();
    if (!d) return;

    const temp = parseFloat(d.temperatura) || 0;
    const hum  = parseFloat(d.humedad)     || 0;
    const aire = parseFloat(d.calidad_aire) || 0;

    set('ar-temp', 'value', temp.toFixed(1) + 'C');
    set('ar-hum',  'value', hum.toFixed(0)  + '%');
    set('ar-aire', 'value', aire.toFixed(0) + ' ppm');

    const eT = eTemp(temp), eH = eHum(hum), eA = eAire(aire);

    set('ar-temp-st', 'value', labelEstado(eT));
    set('ar-temp-st', 'color', colorEstado(eT));
    set('ar-hum-st',  'value', labelEstado(eH));
    set('ar-hum-st',  'color', colorEstado(eH));
    set('ar-aire-st', 'value', labelEstado(eA));
    set('ar-aire-st', 'color', colorEstado(eA));

    const eg = [eT,eH,eA].includes('danger')?'danger':[eT,eH,eA].includes('warn')?'warn':'ok';
    set('ar-sphere', 'color', colorEstado(eg));

    const hora = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    set('ar-hora', 'value', 'Actualizado: ' + hora);
    document.getElementById('pill-text').textContent = 'En linea';
  });
</script>
</body>
</html>
