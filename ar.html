<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Lab AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; }

    #ui {
      position:fixed; top:0; left:0; right:0; z-index:999;
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
      pointer-events:none; font-family:sans-serif;
    }
    .ui-title { font-size:12px; font-weight:700; color:#fff; letter-spacing:.1em; text-transform:uppercase; }
    .ui-sub   { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
    #pill {
      display:flex; align-items:center; gap:6px;
      background:rgba(0,212,170,0.18); border:1px solid rgba(0,212,170,0.4);
      border-radius:20px; padding:4px 12px; font-size:10px; color:#00d4aa;
    }
    .pdot { width:6px; height:6px; border-radius:50%; background:#00d4aa; animation:blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* Overlay de estado */
    #estado-overlay {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      z-index:999; pointer-events:none;
      padding:10px 28px; border-radius:30px;
      font-family:monospace; font-size:18px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase;
      display:none; text-align:center;
      border:2px solid;
    }
    #estado-overlay.normal   { display:block; background:rgba(0,212,170,.2); color:#00d4aa; border-color:#00d4aa; }
    #estado-overlay.warn     { display:block; background:rgba(245,158,11,.25); color:#f59e0b; border-color:#f59e0b; animation:pulseWarn 1s infinite; }
    #estado-overlay.danger   { display:block; background:rgba(239,68,68,.3); color:#ef4444; border-color:#ef4444; animation:pulseDanger .5s infinite; }

    @keyframes pulseWarn   { 0%,100%{opacity:1} 50%{opacity:.6} }
    @keyframes pulseDanger { 0%,100%{opacity:1;transform:translateX(-50%) scale(1)} 50%{opacity:.8;transform:translateX(-50%) scale(1.04)} }

    /* Flash de pantalla completa */
    #flash {
      position:fixed; top:0; left:0; right:0; bottom:0;
      z-index:998; pointer-events:none; opacity:0;
      transition:opacity .2s;
    }
    #flash.warn-flash   { background:rgba(245,158,11,.15); animation:flashWarn 1.5s infinite; }
    #flash.danger-flash { background:rgba(239,68,68,.2);   animation:flashDanger .6s infinite; }

    @keyframes flashWarn   { 0%,100%{opacity:0} 50%{opacity:1} }
    @keyframes flashDanger { 0%,100%{opacity:0} 50%{opacity:1} }

    #hint {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      z-index:999; pointer-events:none;
      background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.15);
      border-radius:20px; padding:7px 18px;
      font-size:11px; color:rgba(255,255,255,0.6); white-space:nowrap;
    }
  </style>
</head>
<body>

<div id="flash"></div>

<div id="ui">
  <div>
    <div class="ui-title">LabSense IoT — AR</div>
    <div class="ui-sub">Apunta al marcador Hiro</div>
  </div>
  <div id="pill"><div class="pdot"></div><span id="pill-text">Conectando...</span></div>
</div>

<div id="estado-overlay">● NORMAL</div>
<div id="hint">Mantén el marcador Hiro dentro del encuadre</div>

<a-scene
  embedded
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;"
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; precision:medium;"
  style="width:100vw;height:100vh;">

  <a-assets>
    <canvas id="panel-canvas" width="1024" height="460"></canvas>
  </a-assets>

  <a-marker preset="hiro">

    <a-plane
      id="panel-plane"
      position="0 0.01 0"
      rotation="-90 0 0"
      width="2.2" height="1.0"
      material="src:#panel-canvas; transparent:true;">
    </a-plane>

    <a-sphere
      id="ar-sphere"
      position="0 0.9 0"
      radius="0.13"
      color="#00d4aa"
      animation="property:position; from:0 0.75 0; to:0 1.05 0; dir:alternate; dur:1000; loop:true; easing:easeInOutSine"
      animation__scale="property:scale; from:1 1 1; to:1.15 1.15 1.15; dir:alternate; dur:800; loop:true; easing:easeInOutSine">
    </a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const DB_URL = "https://smart-lab-monitor-d758a-default-rtdb.firebaseio.com/laboratorio.json";
  const canvas = document.getElementById('panel-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function colorEstado(e) { return {ok:'#00d4aa', warn:'#f59e0b', danger:'#ef4444'}[e]; }
  function labelEstado(e) { return {ok:'Normal', warn:'PRECAUCION', danger:'PELIGRO'}[e]; }
  function eTemp(v) { return v>35?'danger':v>30?'warn':'ok'; }
  function eHum(v)  { return v>80?'danger':v>70?'warn':'ok'; }
  function eAire(v) { return v>800?'danger':v>500?'warn':'ok'; }

  function roundRect(ctx,x,y,w,h,r) {
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    ctx.beginPath();
    ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    ctx.lineTo(x+r.bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y);
    ctx.closePath();
  }

  function drawPanel(temp, hum, aire, eg) {
    const eT=eTemp(temp), eH=eHum(hum), eA=eAire(aire);
    const mainColor = colorEstado(eg);

    ctx.clearRect(0,0,W,H);

    // Fondo con borde de color según estado
    ctx.fillStyle='rgba(5,13,26,0.95)';
    roundRect(ctx,0,0,W,H,32); ctx.fill();

    // Borde exterior del color del estado (más grueso en peligro)
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = eg==='danger' ? 8 : eg==='warn' ? 5 : 3;
    roundRect(ctx,2,2,W-4,H-4,30); ctx.stroke();

    // Barra superior
    ctx.fillStyle = mainColor;
    roundRect(ctx,0,0,W,16,{tl:32,tr:32,bl:0,br:0}); ctx.fill();

    // Título
    ctx.fillStyle = mainColor;
    ctx.font = 'bold 38px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SMART LAB MONITOR', W/2, 72);

    //
